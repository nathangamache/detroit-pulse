# Detroit Pulse backing services for a shared host.
#
#   docker-compose up -d        # start PostGIS + Redis (reads ./.env)
#   docker-compose stop         # stop; named volumes are kept
#   (Compose v2 works the same: `docker compose up -d`.)
#
# Both services publish ONLY on 127.0.0.1 and use ports that don't collide with
# the other stacks already running on the box.
# The full container stack (deploy/docker-compose.yml) reuses these data volumes and
# container names, so run one or the other (docs/godseye-integration.md).
# Passwords come from .env (never committed); compose refuses to start without them.
x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgis:
    <<: *hardening
    image: postgis/postgis:16-3.4
    container_name: pulse-postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-detroitpulse}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    # The entrypoint starts as root and drops to the postgres user with gosu.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - password_encryption=scram-sha-256
    ports:
      - "127.0.0.1:${PULSE_PG_PORT:-5436}:5432"
    volumes:
      - pulse_pgdata:/var/lib/postgresql/data
    shm_size: 256m
    cpus: 4.0
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    <<: *hardening
    image: redis:7-alpine
    container_name: pulse-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    user: "redis"
    # requirepass is written to a tmpfs config file so it never appears in argv.
    # FLUSHALL/FLUSHDB/CONFIG/DEBUG are disabled: nothing in Pulse needs them.
    command:
      - sh
      - -c
      - >-
        printf 'requirepass %s\nappendonly yes\nprotected-mode yes\nmaxmemory 512mb\nmaxmemory-policy noeviction\nrename-command FLUSHALL ""\nrename-command FLUSHDB ""\nrename-command CONFIG ""\nrename-command DEBUG ""\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        && exec redis-server /tmp/redis.conf
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=0700,uid=999,gid=1000
    ports:
      - "127.0.0.1:${PULSE_REDIS_PORT:-6381}:6379"
    volumes:
      - pulse_redisdata:/data
    cpus: 1.0
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pulse_pgdata:
  pulse_redisdata:
