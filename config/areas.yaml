# Coverage areas: GENERIC PUBLIC EXAMPLE.
#
# Put your real areas (home, work, school, ...) in config/areas.local.yaml, which is
# gitignored and, when present, is used INSTEAD of this file. Never commit personal
# points. Copy this file to start:  cp config/areas.yaml config/areas.local.yaml
#
# coverage_bbox  geocoder results outside it are rejected, and the local geocoder index is built
#                for it (Wayne + Oakland + Washtenaw + Macomb; south, west, north, east)
# default_bias   point used to bias geocoders when a channel has no bias of its own
# areas          named circles: used for whisper vocab, channel biasing and API filters
#   vocab        street/place names whisper should expect there (public names only)

coverage_bbox: {south: 42.01, west: -84.16, north: 42.92, east: -82.68}

default_bias: {lat: 42.3314, lon: -83.0458}      # downtown Detroit

areas:
  - id: ann_arbor
    name: Ann Arbor (city center)
    lat: 42.2808
    lon: -83.7430
    radius_km: 8
    county: Washtenaw
    city: Ann Arbor
    vocab: [Washtenaw Avenue, Packard, Stadium Boulevard, Huron Parkway, Plymouth Road,
            Main Street, State Street, Liberty, Fuller, Geddes, Eisenhower, Jackson Avenue,
            Ellsworth, Carpenter, M-14, US-23, I-94]

  - id: downtown_detroit
    name: Downtown Detroit
    lat: 42.3314
    lon: -83.0458
    radius_km: 6
    county: Wayne
    city: Detroit
    vocab: [Woodward, Jefferson, Gratiot, Michigan Avenue, Grand River, Lodge, I-375, Fisher Freeway]

  - id: pontiac
    name: Pontiac (Oakland County seat)
    lat: 42.6389
    lon: -83.2910
    radius_km: 8
    county: Oakland
    city: Pontiac
    vocab: [Telegraph, Woodward, Square Lake, Huron Street, Perry Street, Opdyke, M-59]
