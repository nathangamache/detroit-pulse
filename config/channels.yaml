# SDR channel metadata: GENERIC EXAMPLE. Real channels go in config/channels.local.yaml
# (gitignored), which replaces this file when present.
#
# Do NOT put RadioReference-derived frequencies or talkgroups in any committed file
# (RadioReference's terms forbid AI/ML use of their data). Build the rail plan from
# FCC ULS public data (scripts/import_fcc_uls.py) or from your own monitoring.
#
# How SDR files map to a channel (ingest/sources/sdr_files.py):
#   templates   rtl_airband `filename_template` values for this channel (one per output)
#   talkgroups  trunk-recorder talkgroup ids (P25 systems rtl_airband can't decode)
#   freq_mhz    fallback match when rtl_airband `include_freq = true` (scan mode)
#
# kind: police | fire | ems | public_safety | rail_road | rail_dispatcher | rail_yard |
#       rail_detector | rail_voice | eot | other
#       (rail_voice = a railroad voice frequency whose use isn't confirmed on air yet)
# unit_prefix  namespaces unit IDs across agencies in correlation (e.g. "AAFD:Engine 5")
# bias         geocoder bias point; else the area's center, else areas.default_bias
#              (eot: the receiver's location; give it coverage.radius_km too: /v1/rail/activity
#              attributes its telemetry only to points within that radius, none without one)
# vocab        extra whisper hints for this channel (public street/place names)
#
# For /v1/feeds/status (docs/pulse-api.md#feeds_status):
# receiver     the receiver that hears this channel; its heartbeat is
#              RECEIVER_STATUS_DIR/<name>.prom or <name>.heartbeat, and its start marker <name>.started
#              (docs/sdr-ingest.md#6-receiver-heartbeats).
#              Default: rail-airband for rail_* voice kinds, traintap-eot for eot, none otherwise.
# coverage     what it hears: {area, radius_km, lines: [{railroad, name, aliases: [...]}]}; aliases
#              are the same track's names in other datasets (FRA vs NARN). Default: from the rail plan.
#              radius_km is its reach: around `bias` (or the `area_id` area), else from the center of
#              each subdivision it is on (never beyond that subdivision's own area).
# example      true for a placeholder (as is any id starting "example_"): reported with
#              "example": true and never counted in coverage_summary.
#
# receivers:   optional top-level map, receiver name -> {device: "<description>"}, e.g.
#   receivers: {rail-airband: {device: "rail-airband: RTL-SDR serial RAIL160 (rtl_airband)"}}
#
# The example_* channels below are placeholders. eot_hot is real and generic (the EOT/HOT
# frequencies are a national standard); give it a `bias` point in channels.local.yaml.

channels:
  - id: example_fire_dispatch
    label: Example city fire dispatch (analog NFM)
    kind: fire
    templates: [fire_dispatch]
    freq_mhz: null            # set locally
    agency: Example Fire Department
    unit_prefix: EXFD
    county: Washtenaw
    city: Ann Arbor
    area_id: ann_arbor
    enabled: true
    priority: 1

  - id: example_rail_road
    label: Example railroad road channel
    kind: rail_road
    templates: [rail_road]
    freq_mhz: null            # AAR channel in the 160-161.6 MHz railroad pool; set locally
    railroad: EXAMPLE_RR
    subdivision: Example Subdivision
    county: Wayne
    enabled: true
    priority: 2

  - id: example_rail_detector
    label: Example railroad defect detector (shares the road channel on most lines)
    kind: rail_detector
    templates: [rail_detector]
    freq_mhz: null
    railroad: EXAMPLE_RR
    subdivision: Example Subdivision
    enabled: false

  # traintap telemetry (not audio). AAR S-9152 standard frequencies, public:
  # EOT 457.9375 MHz (rear -> loco), HOT 452.9375 MHz (loco -> rear), DPU 457.9250 MHz.
  - id: eot_hot
    label: EOT/HOT telemetry (traintap)
    kind: eot
    freq_mhz: 457.9375
    enabled: true
