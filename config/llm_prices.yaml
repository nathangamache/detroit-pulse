# Claude API list prices, USD per million tokens, for prompts <= 100K tokens.
# Source: claude-api skill (cached 2026-11-03) and platform.claude.com pricing page
# (verified 2026-11-13 in the cost-model report). Cache reads are 0.1x input on Haiku 5.5;
# 5-minute cache writes are 1.25x input, 1-hour cache writes 2x input.
# Bump price_version whenever a number changes; every llm_usage row records it.
price_version: "2026-11-13"
models:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write_5m: 0.125
    cache_write_1h: 0.20
    long_context_threshold: 100000      # above this prompt size Haiku 5.5 bills 5x (0.50 / 2.50)
    long_context_multiplier: 5.0
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.10
    cache_write_5m: 2.50
    cache_write_1h: 4.00
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write_5m: 5.00
    cache_write_1h: 8.00
# Any model not listed is priced at the most expensive row (fail safe).
