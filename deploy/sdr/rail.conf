# rtl_airband (RTLSDR-Airband v7) config for the `rail-airband` container (compose profile `sdr`).
#
# One RTL-SDR Blog V3, selected by its EEPROM serial RAIL160 (set once with `rtl_eeprom -s RAIL160`),
# sampling 2.56 MS/s centred on 160.8975 MHz: about 159.7-162.1 MHz is usable, which covers the
# whole AAR railroad pool (160.110-161.565 MHz). Each channel writes one MP3 per transmission into
# /recordings (the pulse_sdr volume Pulse's `sdr_files` source watches), file names in UTC.
#
# The channel list is EMPTY on purpose: no frequencies are committed to this public repo.
#   uv run python scripts/render_rail_conf.py     # -> deploy/sdr/rail.local.conf (gitignored)
# fills it from config/channels.local.yaml (enabled rail_* channels with freq_mhz in range).
# rtl_airband refuses to start with an empty list, so render before enabling the sdr profile.
#
# Per-channel output written by the renderer (see the comment block at the bottom):
#   split_on_transmission = true      one file per transmission
#   include_freq = true               "<template>_<YYYYmmdd_HHMMSS>_<freq Hz>.mp3"
#   dated_subdirectories = true       /recordings/YYYY/MM/DD/
#   split_tx_drop_shorter_than = 0.5  drop squelch blips under 0.5 s
#   split_max_file_time = 60          long transmissions continue in a new file every 60 s

devices: (
  {
    type = "rtlsdr";
    serial = "RAIL160";
    gain = 30.0;
    correction = 0;
    centerfreq = 160.8975;
    sample_rate = 2.56;
    mode = "multichannel";
    channels: (
      # @CHANNELS@
    );
  }
);

